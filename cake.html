<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magical Dream Cake for Thiyana</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --dream-chocolate: #3d2314;
            --dream-gold: #d4af37;
            --cream-pink: #ffb3c1;
            --royal-pink: #ff6b8b;
        }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ffe5ec 0%, #ffc2d1 50%, #f7e1ff 100%);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Georgia', serif;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- Magical Floating Flowers & Sparkles Background --- */
        .bg-flowers {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0; left: 0;
            z-index: 1;
            pointer-events: none;
        }

        .flower-particle {
            position: absolute;
            width: 30px;
            height: 30px;
            background: #ff758f;
            border-radius: 50%;
            animation: floatUp 6s infinite linear;
            opacity: 0.7;
        }
        .flower-particle::before, .flower-particle::after {
            content: '';
            position: absolute;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: inherit;
        }
        .flower-particle::before { transform: rotate(30deg); background: #ff8fa3; }
        .flower-particle::after { transform: rotate(60deg); background: #ffccd5; }

        @keyframes floatUp {
            0% { transform: translateY(110vh) scale(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.3) rotate(360deg); opacity: 0; }
        }

        /* --- Dream Cake Container --- */
        .cake-stage {
            position: relative;
            z-index: 2;
            text-align: center;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            padding: 50px;
            border-radius: 40px;
            box-shadow: 0 20px 50px rgba(61, 35, 20, 0.2);
            border: 4px solid #fff;
            max-width: 500px;
            width: 90%;
        }

        h1 {
            color: var(--dream-chocolate);
            font-size: 2rem;
            margin-bottom: 10px;
            text-shadow: 1px 1px 0px #fff;
        }

        p {
            color: #6c584c;
            font-size: 1.1rem;
            margin-bottom: 40px;
        }

        /* --- Pure CSS BIG DREAM CAKE --- */
        .dream-cake-container {
            position: relative;
            width: 280px;
            height: 260px;
            margin: 0 auto;
            cursor: pointer;
        }

        /* The Premium Gold Tin Shell */
        .tin-container {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 260px;
            height: 140px;
            background: linear-gradient(to right, #b38f1d, #ffd700, #f3e5ab, #b38f1d);
            border-radius: 20px 20px 30px 30px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2), inset 0 -10px 20px rgba(0,0,0,0.2);
            overflow: hidden;
            border: 2px solid #fff;
        }

        /* Cake Layers Inside the Tin */
        .cake-layers {
            position: absolute;
            top: 15px;
            left: 5px;
            width: 250px;
            height: 120px;
            border-radius: 15px 15px 20px 20px;
            overflow: hidden;
        }

        /* Layer 1: Soft Sponge Base */
        .layer-sponge {
            position: absolute;
            bottom: 0; width: 100%; height: 40px;
            background: #5c3a21;
        }

        /* Layer 2: Mousse Cream */
        .layer-mousse {
            position: absolute;
            bottom: 40px; width: 100%; height: 35px;
            background: #7a431d;
            border-top: 3px dashed var(--cream-pink);
        }

        /* Layer 3: Hard Chocolate Shell Top */
        .layer-hard-shell {
            position: absolute;
            top: 15px; width: 100%; height: 32px;
            background: linear-gradient(to bottom, #2b170c, #3d2314);
            border-radius: 10px 10px 0 0;
            box-shadow: inset 0 5px 5px rgba(255,255,255,0.2);
            transition: all 0.5s ease;
        }

        /* Animated Cocoa Powder Dusting Effect */
        .cocoa-dust {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(rgba(0,0,0,0.15) 10%, transparent 11%);
            background-size: 8px 8px;
            opacity: 0.7;
        }

        /* --- Magic Melted Chocolate Syrup Pouring --- */
        .syrup-drip {
            position: absolute;
            top: 0;
            left: 10%;
            width: 80%;
            height: 0;
            background: linear-gradient(to bottom, #211107, #3d2314);
            border-radius: 0 0 15px 15px;
            z-index: 5;
            transition: height 3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .dream-cake-container.active .syrup-drip {
            height: 90px;
            box-shadow: 0 10px 15px rgba(0,0,0,0.4);
        }

        /* --- Royal Candle & Flame --- */
        .candle {
            position: absolute;
            bottom: 150px;
            left: 50%;
            transform: translateX(-50%);
            width: 16px;
            height: 65px;
            background: linear-gradient(to right, #ffccd5, #ff6b8b, #ffccd5);
            border-radius: 8px 8px 3px 3px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            z-index: 6;
            transition: opacity 0.5s ease;
        }

        .flame {
            position: absolute;
            top: -26px;
            left: 50%;
            transform: translateX(-50%);
            width: 18px;
            height: 30px;
            background: radial-gradient(circle, #ffea00 20%, #ff6a00 60%, transparent 100%);
            border-radius: 50% 50% 20% 20%;
            box-shadow: 0 0 20px #ffea00, 0 0 40px #ff6a00;
            animation: flameFlicker 0.6s infinite alternate ease-in-out;
        }

        @keyframes flameFlicker {
            0% { transform: translateX(-50%) scale(1) rotate(-2deg); }
            100% { transform: translateX(-50%) scale(1.15) rotate(3deg) skewX(3deg); }
        }

        /* --- Action Button --- */
        button {
            margin-top: 40px;
            background: linear-gradient(45deg, var(--dream-chocolate), #5c3a21);
            color: #ffd700;
            border: 2px solid #ffd700;
            padding: 15px 40px;
            font-size: 1.1rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 10px 25px rgba(61, 35, 20, 0.3);
            transition: all 0.3s ease;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 30px rgba(61, 35, 20, 0.5);
            background: linear-gradient(45deg, #5c3a21, var(--dream-chocolate));
        }
    </style>
</head>
<body>

    <div class="bg-flowers" id="flower-box"></div>

    <div class="cake-stage">
        <h1 id="title">My Queen's 5-Layer Dream Cake 🎂</h1>
        <p id="instruction">Click the Flame to Blow & Melt the Chocolate Layer!</p>

        <div class="dream-cake-container" id="cake-box" onclick="triggerDreamMelt()">
            
            <div class="candle" id="cake-candle">
                <div class="flame"></div>
            </div>

            <div class="tin-container">
                <div class="cake-layers">
                    <div class="layer-sponge"></div>
                    <div class="layer-mousse"></div>
                    <div class="layer-hard-shell">
                        <div class="cocoa-dust"></div>
                    </div>
                    <div class="syrup-drip"></div>
                </div>
            </div>

        </div>

        <div id="btn-container" style="display: none;">
            <button onclick="location.reload()">Reset Magic ✨</button>
        </div>
    </div>

    <script>
        // Background Flower Particles Generator
        function createFlowerStorm() {
            const box = document.getElementById('flower-box');
            setInterval(() => {
                const flower = document.createElement('div');
                flower.classList.add('flower-particle');
                flower.style.left = Math.random() * 100 + 'vw';
                
                // Randomize beautiful colors for the flowers
                const colors = ['#ff4d6d', '#ff758f', '#ff8fa3', '#ffb3c1', '#f7aef8', '#b388eb'];
                flower.style.background = colors[Math.floor(Math.random() * colors.length)];
                
                const size = Math.random() * 20 + 15;
                flower.style.width = size + 'px';
                flower.style.height = size + 'px';
                flower.style.animationDuration = Math.random() * 3 + 4 + 's';
                
                box.appendChild(flower);
                setTimeout(() => { flower.remove(); }, 6000);
            }, 300);
        }
        createFlowerStorm();

        // Dream Cake Interaction Logic
        let isBlown = false;
        function triggerDreamMelt() {
            if (isBlown) return;
            isBlown = true;

            // 1. Extinguish Candle Flame
            document.getElementById('cake-candle').style.opacity = '0';
            document.getElementById('instruction').innerText = "Wishing... Processing Magic Layer... ✨";
            
            // 2. Trigger Premium Confetti Blast
            confetti({
                particleCount: 250,
                spread: 100,
                origin: { y: 0.6 },
                colors: ['#3d2314', '#d4af37', '#ff6b8b', '#ffffff', '#ffb3c1']
            });

            // 3. Trigger Chocolate Syrup Melting Drip Animation
            setTimeout(() => {
                document.getElementById('cake-box').classList.add('active');
                document.getElementById('title').innerText = "Happy Birthday Thiyana! ❤️";
                document.getElementById('instruction').innerText = "The Ultimate Rich Dream Cake is Ready for You!";
                document.getElementById('btn-container').style.display = 'block';
            }, 1000);
        }
    </script>
</body>
</html>
